<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Career Applicants</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    * { font-family: 'Poppins', sans-serif; margin: 0; padding: 0; box-sizing: border-box; }

    body { display: flex; background: #f4f4f4; }

    .sidebar {
      width: 260px;
      background: #1f2937;
      height: 100vh;
      padding: 20px;
      color: #fff;
      position: fixed;
    }

    .sidebar h2 { margin-bottom: 30px; }
    .sidebar a { color:white; text-decoration:none; display:flex; gap:10px; }
    .sidebar li { padding:10px; margin:10px 0; border-radius:8px; list-style: none; }

    .main-content {
      margin-left: 260px;
      padding: 30px;
      width: 100%;
    }

    .section-title { font-size: 24px; margin-bottom: 20px; }

    .search-bar {
      margin-bottom: 20px;
      display: flex;
      gap: 10px;
    }

    .search-bar input {
      padding: 10px;
      width: 300px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      border-radius: 8px;
      overflow: hidden;
    }

    th, td {
      padding: 14px;
      border-bottom: 1px solid #ddd;
      font-size: 14px;
    }

    th {
      background: #e5e7eb;
      font-weight: 600;
    }
  </style>
</head>
<body>

<div class="sidebar">
  <h2>Admin Panel</h2>
  <ul>
    <li><a href="admin-page.html"><i class="bi bi-house"></i> Dashboard</a></li>
    <li><a href="inquire.html"><i class="bi bi-chat-left-text"></i> Inquiries</a></li>
    <li><a href="career-application.html"><i class="bi bi-people"></i> Career Applicants</a></li>
  </ul>
</div>

<div class="main-content">

  <h1 class="section-title">Career Applicants</h1>

  <div class="search-bar">
    <input type="text" placeholder="Search applicants...">
  </div>

  <table>
    <tr>
      <th>Name</th>
      <th>Email</th>
      <th>Contact</th>
      <th>Address</th>
      <th>Date Applied</th>
      <th>CV file</th>
    </tr>
  </table>

</div>

</body>
</html>
