<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inquiries</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/contact.css" />
</head>
<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <h2>Admin Panel</h2>
  <ul>
    <li><a href="admin-page.html"><i class="bi bi-house"></i> Dashboard</a></li>
    <li><a href="inquire.html"><i class="bi bi-chat-left-text"></i> Inquiries</a></li>
    <li><a href="career-application.html"><i class="bi bi-people"></i> Career Applicants</a></li>
    <li><a href="contact.html"><i class="bi bi-envelope"></i> Contact</a></li>
  </ul>
</div>

<div class="main-content">

  <h1 class="section-title">Contacts</h1>

  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="Search contacts by name, email, phone or message...">
  </div>

  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Contact</th>
        <th>Date</th>
        <th>Message</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="contactTableBody">
      <!-- rows injected here by js/admin-inquiries.js -->
    </tbody>
  </table>

</div>

<!-- load admin script as a module from local js folder -->
<script type="module" src="../js/contact-inquiries.js"></script>
</body>
</html>
