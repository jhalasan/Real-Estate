<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Real Estate Admin Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/admin-page.css" />
</head>
<body>

<div class="sidebar">
  <h2>Admin Panel</h2>
  <ul>
    <li><a href="inquire.html"><i class="bi bi-chat-left-text"></i> Inquiries</a></li>
    <li><a href="career-application.html"><i class="bi bi-people"></i> Career Applicants</a></li>
    <li><a href="contact-us.html"><i class="bi bi-envelope"></i> Contact</a></li>
    <li><i class="bi bi-shield-lock"></i> Entry Logs</li>
    <li><i class="bi bi-pencil-square"></i> Auditing</li>
    <li><i class="bi bi-newspaper"></i> Real Estate News</li>
    <li><i class="bi bi-building"></i> New Projects</li>
    <li><i class="bi bi-calendar-event"></i> Calendar</li>
  </ul>
</div>

<!-- MAIN CONTENT -->
<div class="main-content">

  <h1 class="section-title">Dashboard Overview</h1>

  <div class="cards">
    <div class="card">
      <h3>Total Inquiries</h3>
      <!-- added id for JS to update -->
      <p id="total-inquiries-count">-</p>
    </div>
    <div class="card">
      <h3>Career Applicants</h3>
      <!-- added id for JS to update -->
      <p id="total-career-count">-</p>
    </div>
    <div class="card">
      <h3>Contacts</h3>
      <!-- added id for JS to update -->
      <p id="total-contact-count">-</p>
    </div>
  </div>

</div>

<!-- load admin counts module -->
<script type="module" src="../js/admin-counts.js"></script>
</body>
</html>
